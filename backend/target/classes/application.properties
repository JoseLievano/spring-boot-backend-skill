spring.application.name=agentForgeBackend

# DB Config
# Configured for PostgreSQL in Docker environment
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Files
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# File Signature Secret
# In production, this MUST be set via environment variable: FILE_SIGNATURE_SECRET
file.signature.secret=${JWT_SECRET}

# JWT Secret
# In production, this MUST be set via environment variable: JWT_SECRET
TK_KEY=${JWT_SECRET}

#To Delete
#logging.level.org.springframework.security=TRACE
# Logs for real-time monitoring
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE