spring.application.name=authServer
# DB Config
spring.datasource.url=jdbc:mysql://localhost:3306/wp_manager
spring.datasource.username=jlievano
spring.datasource.password=natalie
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# Files
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# File Signature Secret
# In production, this MUST be set via environment variable: FILE_SIGNATURE_SECRET
# The secret should be a random string of at least 32 characters
file.signature.secret=${FILE_SIGNATURE_SECRET:changeme-in-production}

# JWT Secret
# In production, this MUST be set via environment variable: TK_KEY
# The secret should be a long random string (at least 64 characters)
TK_KEY=${JWT_SECRET_KEY:local-dev-jwt-secret-key-32-chars-at-least-1234567890}

