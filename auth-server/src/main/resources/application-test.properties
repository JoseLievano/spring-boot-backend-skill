spring.application.name=authServer-test

# H2 Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Files (same as production)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT Secret for testing
TK_KEY=testSecretKeyForTestingPurposesOnly1234567890123456789012345678901234567890

# Test environment uses fixed secret for reproducibility
file.signature.secret=test-secret-key-for-unit-tests-only-do-not-use-in-production

# Disable scheduling during tests (to prevent FileDuplicator from running)
spring.task.scheduling.enabled=false
